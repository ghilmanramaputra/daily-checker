name: Buck Blader watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may start it late)
  workflow_dispatch:          # "Run workflow" button for manual tests

permissions:
  contents: write             # needed to save seen.json

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Mercari (3 checks, 3 minutes apart)
        run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHECKS: 3
          INTERVAL_SEC: 180

      - name: Save seen list
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen listings"
            git pull --rebase
            git push
          fi
