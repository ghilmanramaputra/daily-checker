name: Buck Blader watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may start it late)
  workflow_dispatch:          # "Run workflow" button for manual tests

permissions:
  contents: write             # needed to save seen.json

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # seen.json is read and written through the GitHub API inside check.mjs,
      # shared with the PC watcher so a listing is never notified twice
      - name: Check Mercari (3 checks, 3 minutes apart)
        run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKS: 3
          INTERVAL_SEC: 180
